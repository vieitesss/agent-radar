name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Run test scripts
        shell: sh
        run: |
          set -eu
          for test_script in scripts/test-*; do
            [ -f "$test_script" ] || continue
            printf 'Running %s\n' "$test_script"
            if ! sh "$test_script"; then
              printf 'FAILED: %s\n' "$test_script" >&2
              exit 1
            fi
          done

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Verify tag is on main
        shell: sh
        run: |
          git fetch origin '+refs/heads/main:refs/remotes/origin/main' --tags
          if ! git merge-base --is-ancestor "${GITHUB_REF_NAME}^{commit}" origin/main; then
            printf 'Release tag %s is not on origin/main\n' "$GITHUB_REF_NAME" >&2
            exit 1
          fi
      - name: Generate release notes and publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: sh
        run: |
          set -eu
          tag=$GITHUB_REF_NAME
          if previous_tag=$(git describe --tags --abbrev=0 "$tag^" 2>/dev/null); then
            :
          else
            previous_tag=
          fi
          notes=$(mktemp)
          trap 'rm -f "$notes"' EXIT INT TERM HUP
          scripts/agent-radar-release-notes "$previous_tag" "$tag" "$GITHUB_REPOSITORY_OWNER" > "$notes"
          gh release create "$tag" --title "$tag" --notes-file "$notes" --verify-tag
