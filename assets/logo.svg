      <stop offset="0%" stop-color="#27293d"/>
      <stop offset="100%" stop-color="#1a1b2b"/>
    </radialGradient>
    <linearGradient id="sweep" x1="64" y1="64" x2="116" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#89b4fa" stop-opacity="0.05"/>
